<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBAXX - JB Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d0f17;
            color: #ffffff;
            user-select: none;
        }
        .bg-pattern {
            background: linear-gradient(135deg, #0d0f17 0%, #16192b 100%);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen pb-24">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-[#0d0f17]/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white font-extrabold px-3 py-1.5 rounded-xl text-sm shadow-lg shadow-blue-600/30 flex items-center gap-1.5">
                <span class="text-xs">IBAXX</span>
            </div>
            <h1 class="text-lg font-black tracking-wider text-white">IBAXX</h1>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Tombol Admin Panel Tersembunyi (Ikon Berlian) -->
            <button onclick="toggleAdminModal(true)" class="bg-gray-900 border border-gray-700 px-3 py-1.5 rounded-xl flex items-center gap-1 text-xs font-bold text-blue-400 hover:bg-gray-800 transition">
                <span>💎</span>
            </button>
            <!-- Tombol Sound Toggle -->
            <button onclick="toggleSound()" id="soundBtn" class="bg-gray-900 border border-gray-700 p-2 rounded-xl text-gray-300 hover:bg-gray-800">
                🔊
            </button>
            <!-- Tombol Keranjang Header -->
            <button onclick="switchTab('keranjang')" class="bg-gray-900 border border-gray-700 p-2 rounded-xl text-gray-300 hover:bg-gray-800 relative">
                🛒
                <span id="cartHeaderBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="appContent" class="max-w-md mx-auto px-4 pt-4">
        <!-- Konten dinamis -->
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#121522]/95 backdrop-blur-lg border-t border-gray-800 px-2 py-2 flex justify-around items-center z-30">
        <button onclick="switchTab('beranda')" id="nav-beranda" class="flex flex-col items-center gap-1 text-blue-500 transition">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold tracking-wider">BERANDA</span>
        </button>
        <button onclick="switchTab('stok')" id="nav-stok" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <span class="text-xl">📦</span>
            <span class="text-[10px] font-bold tracking-wider">STOK</span>
        </button>
        <button onclick="switchTab('favorit')" id="nav-favorit" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition relative">
            <span class="text-xl">❤️</span>
            <span class="text-[10px] font-bold tracking-wider">FAVORIT</span>
        </button>
        <button onclick="switchTab('info')" id="nav-info" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <span class="text-xl">🛡️</span>
            <span class="text-[10px] font-bold tracking-wider">INFO</span>
        </button>
        <button onclick="switchTab('keranjang')" id="nav-keranjang" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition relative">
            <span class="text-xl">🛒</span>
            <span class="text-[10px] font-bold tracking-wider">KERANJANG</span>
        </button>
    </nav>

    <!-- ADMIN PANEL MODAL (RAHASIA) -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-[#16192b] border border-gray-700 w-full max-w-md rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
                <h3 class="text-lg font-bold text-blue-400 flex items-center gap-2">💎 IBAXX Admin Panel</h3>
                <button onclick="toggleAdminModal(false)" class="text-gray-400 hover:text-white text-xl font-bold">✕</button>
            </div>

            <div class="space-y-4">
                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                    <h4 class="font-bold text-sm mb-2 text-blue-300">Pengaturan Toko & Kontak</h4>
                    <div class="space-y-2">
                        <div>
                            <label class="text-xs text-gray-400">Nomor WhatsApp Admin</label>
                            <input type="text" id="adminWaInput" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">Link Grup WhatsApp</label>
                            <input type="text" id="adminGroupInput" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">Link Saluran WhatsApp</label>
                            <input type="text" id="adminChannelInput" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                        </div>
                        <button onclick="saveStoreSettings()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg text-xs font-bold transition mt-2">Simpan Pengaturan</button>
                    </div>
                </div>

                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                    <h4 class="font-bold text-sm mb-2 text-blue-300">Tambah / Kelola Produk Akun</h4>
                    <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-2">
                        <input type="hidden" id="editProductId">
                        <div>
                            <label class="text-xs text-gray-400">Nama Game / Kategori</label>
                            <input type="text" id="prodGame" required placeholder="Contoh: Mobile Legends" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-xs text-gray-400">Kode Akun</label>
                                <input type="text" id="prodCode" required placeholder="JB-0007" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400">Harga (Rp)</label>
                                <input type="number" id="prodPrice" required placeholder="35000" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">Keterangan / Bind</label>
                            <input type="text" id="prodDesc" placeholder="Bind Kosong" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">URL Gambar / Screenshot</label>
                            <input type="text" id="prodImage" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400">Status Stok</label>
                            <select id="prodStatus" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1">
                                <option value="ready">READY</option>
                                <option value="terjual">TERJUAL</option>
                            </select>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 py-2 rounded-lg text-xs font-bold transition">Simpan Produk</button>
                            <button type="button" onclick="resetProductForm()" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg text-xs font-bold transition">Reset</button>
                        </div>
                    </form>
                </div>

                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                    <h4 class="font-bold text-sm mb-2 text-blue-300">Daftar Stok di Database</h4>
                    <div id="adminProductList" class="space-y-2 max-h-48 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const defaultStoreData = {
            settings: {
                waAdmin: "085656021660",
                groupWa: "https://whatsapp.com/channel/...",
                channelWa: "https://whatsapp.com/channel/..."
            },
            products: [
                { id: "1", game: "JBKU", code: "JB-0006", price: 3000, desc: "Full Spek & Foto", image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300", status: "ready" },
                { id: "2", game: "JBKU", code: "JB-0003", price: 5000, desc: "Bind Off", image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300", status: "terjual" },
                { id: "3", game: "MOBILE LEGENDS", code: "JB-0004", price: 40000, desc: "Bind Kosong", image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300", status: "terjual" },
                { id: "4", game: "FREE FIRE", code: "JB-0003", price: 30000, desc: "Bind Kosong", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300", status: "terjual" }
            ]
        };

        let appState = JSON.parse(localStorage.getItem('ibaxx_store_data')) || defaultStoreData;
        let currentTab = 'beranda';
        let favorites = JSON.parse(localStorage.getItem('ibaxx_favs')) || [];
        let cart = JSON.parse(localStorage.getItem('ibaxx_cart')) || [];
        let soundEnabled = true;

        function saveData() {
            localStorage.setItem('ibaxx_store_data', JSON.stringify(appState));
            localStorage.setItem('ibaxx_favs', JSON.stringify(favorites));
            localStorage.setItem('ibaxx_cart', JSON.stringify(cart));
            updateBadges();
        }

        function playSoundEffect() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        function switchTab(tab) {
            playSoundEffect();
            currentTab = tab;
            ['beranda', 'stok', 'favorit', 'info', 'keranjang'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if(el) {
                    if(t === tab) {
                        el.className = "flex flex-col items-center gap-1 text-blue-500 transition scale-105";
                    } else {
                        el.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-white transition";
                    }
                }
            });
            renderContent();
        }

        function updateBadges() {
            const cartCount = cart.length;
            const cartBadge = document.getElementById('cartHeaderBadge');
            if(cartCount > 0) {
                cartBadge.innerText = cartCount;
                cartBadge.classList.remove('hidden');
            } else {
                cartBadge.classList.add('hidden');
            }
        }

        function renderContent() {
            const container = document.getElementById('appContent');
            const readyCount = appState.products.filter(p => p.status === 'ready').length;
            const soldCount = appState.products.filter(p => p.status === 'terjual').length;

            if (currentTab === 'beranda') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-blue-900/60 to-gray-900 border border-blue-500/30 rounded-2xl p-4 shadow-xl relative overflow-hidden">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded font-bold uppercase tracking-wider">Verified Store</span>
                                    <h2 class="text-xl font-black mt-1 text-white">IBAXX</h2>
                                    <p class="text-xs text-gray-400">ID IBA-0539 · ${readyCount} READY</p>
                                </div>
                                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-black text-lg shadow-lg">IBX</div>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-800 flex items-center justify-between text-xs text-blue-400 font-bold">
                                <span>🔒 TRANSAKSI AMAN VIA ADMIN</span>
                                <span>⚡ VERIFIED</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl">
                                <span class="text-xs text-gray-400 block">READY</span>
                                <span class="text-lg font-black text-blue-400">${readyCount}</span>
                            </div>
                            <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl">
                                <span class="text-xs text-gray-400 block">TERJUAL</span>
                                <span class="text-lg font-black text-gray-300">${soldCount}</span>
                            </div>
                            <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl">
                                <span class="text-xs text-gray-400 block">STATUS</span>
                                <span class="text-sm font-black text-green-400">✓ AMAN</span>
                            </div>
                        </div>

                        <button onclick="switchTab('stok')" class="w-full bg-blue-600 hover:bg-blue-700 font-extrabold py-3 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 transition text-sm">
                            📦 LIHAT SEMUA STOK AKUN
                        </button>

                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="switchTab('favorit')" class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center hover:border-blue-500 transition">
                                <span class="text-lg block mb-1">❤️</span>
                                <span class="text-xs font-bold">Favorit</span>
                            </button>
                            <button onclick="switchTab('info')" class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center hover:border-blue-500 transition">
                                <span class="text-lg block mb-1">🛡️</span>
                                <span class="text-xs font-bold">Info Toko</span>
                            </button>
                            <a href="https://wa.me/${appState.settings.waAdmin}" target="_blank" class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center hover:border-blue-500 transition block">
                                <span class="text-lg block mb-1">💬</span>
                                <span class="text-xs font-bold">Chat Admin</span>
                            </a>
                        </div>

                        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-4">
                            <h3 class="font-bold text-sm mb-3 flex items-center gap-2 text-blue-400">🛡️ CARA BELI</h3>
                            <ol class="space-y-2 text-xs text-gray-300">
                                <li class="flex gap-2"><span>01</span> Pilih akun, buka detail untuk lihat spek & foto HD.</li>
                                <li class="flex gap-2"><span>02</span> Chat admin lewat WhatsApp, tanyakan detail jika perlu.</li>
                                <li class="flex gap-2"><span>03</span> Bayar sesuai arahan admin, data akun dikirim instan.</li>
                            </ol>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'stok') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <h2 class="font-extrabold text-sm uppercase tracking-wider text-blue-400">Inventaris Akun (${appState.products.length})</h2>
                        </div>
                        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari game, kode, atau rank..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white">
                        <div id="productListContainer" class="space-y-3">
                            ${renderProductCards(appState.products)}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'favorit') {
                const favProducts = appState.products.filter(p => favorites.includes(p.id));
                container.innerHTML = `
                    <div class="space-y-3">
                        <h2 class="font-extrabold text-sm uppercase tracking-wider text-blue-400">Akun Favorit (${favProducts.length})</h2>
                        ${favProducts.length === 0 ? `
                            <div class="text-center py-12 bg-gray-900/50 rounded-2xl border border-gray-800">
                                <span class="text-3xl block mb-2">❤️</span>
                                <p class="te
